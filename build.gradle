buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }

}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
    maven {
        // EMI
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
    maven {
        url = "https://maven.architectury.dev"
    }
    maven {
        // KubeJS, Rhino
        name = "LatvianModder"
        url = "https://maven.latvian.dev/releases"
    }
    maven {
        // Applied Energistics 2
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }

    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    flatDir {
        dir 'libs'
    }
    // TEMPORARY: local Phantasia dev build (see the phantasia dependency below) - flatDir gives
    // Gradle a real resolvable coordinate for it instead of a raw files() collection, which
    // writeClientLegacyClasspath's dependency-constraint code can't handle.
    flatDir {
        dirs "${rootDir}/../Phantasia/build/libs"
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}


apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    // JEI, EMI, Jade
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("curse.maven:jade-324717:5390389")
    modCompileOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modCompileOnly("phantasia:Phantasia:1.0.0")
    modRuntimeOnly("phantasia:Phantasia:1.0.0")

    modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}")
    modCompileOnly("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    modCompileOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")

    // KubeJS - compile-time only, same as JEI/EMI above: the plugin class is only ever
    // instantiated by KubeJS itself (via kubejs.plugins.txt), and only if KubeJS is actually
    // installed, so this mod works fine without it at runtime. Not added as modRuntimeOnly since
    // packs that DO run KubeJS already provide it themselves - bundling/requiring our own copy
    // would just be redundant (and risk a version clash with whatever the pack ships).
    modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")

    // Applied Energistics 2 - soft dependency, same pattern as GTCEu/phoenix_guilds (see
    // AE2Compat): guarded behind ModList.isLoaded("ae2") everywhere, only needs to be on the
    // classpath to compile against.
    modCompileOnly("appeng:appliedenergistics2-forge:${appeng_version}")
    modRuntimeOnly("appeng:appliedenergistics2-forge:${appeng_version}")

    modRuntimeOnly("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    modRuntimeOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")

    // Optional compat, not a hard dependency - QuestProgressTracker/TeamKeyResolver both guard
    // every GuildManager call behind ModList.isLoaded("phoenix_guilds") now, so this only needs
    // to be on the classpath to COMPILE against; modImplementation was wrong here, since that
    // marks it as something this mod always requires/ships with, same mistake GTCEu currently
    // has (see the comment below it) just smaller in scope - phoenix_guilds is a 2-call-site,
    // already-guarded integration, not something baked into core registration like GTCEu is.
    modCompileOnly('local:phoenix_guilds:0.1.0')
    modRuntimeOnly('local:phoenix_guilds:0.1.0')

    // GregTech and dependencies - soft, same as phoenix_guilds above. GTCEuCompat now guards
    // every GTCEu-touching call (registrate setup, the material-registry listener, the
    // energy_check task's block-reading, the multiblock-formed mixin), so this only needs to be
    // on the classpath to COMPILE against. Was modImplementation - a hard requirement - which
    // contradicted mods.toml's own "mandatory = false" for gtceu and meant the mod crashed on
    // construction (a static field eagerly resolved GTRegistrate) for anyone running without it.
    // LDLib/Registrate/configuration aren't independently used by this mod's own code at all -
    // they're only here because GTCEu's slim jar (transitive = false) needs them; their
    // optionality is entirely inherited from GTCEu's.
    modCompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modCompileOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    modCompileOnly("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modRuntimeOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modRuntimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    modRuntimeOnly("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}




tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
}

tasks.register('publishToDomains', Copy) {
    group = 'phoenix'
    description = 'Builds this mod and copies the jar into ../Phoenix-Domains/libs, so Domains picks up local changes.'
    dependsOn 'reobfJar'
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into '../Phoenix-Domains/libs'
}
