buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }

}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

// --- HotChocolate (.hotc) source compilation -----------------------------------------------
//
// `src/main/hotc/*.hotc` gets compiled by the self-hosted HotChocolate compiler (a separate
// checkout, `hotcHome` below -- not a Gradle subproject of this build, just a filesystem
// reference to its own `selfhost/bootstrap` seed and `CodegenShim` classes) into ordinary
// `.class` files, added to this module's own compiled output alongside `src/main/java`'s.
//
// Real, disclosed limitation right now: the self-hosted compiler's own `module a.b.c;`
// declaration is parsed and discarded (no real Java package-qualification yet), so every
// compiled hotc class lands in the DEFAULT (unnamed) package regardless -- referenced from Java
// as a bare `ClassName`, not `net.phoenixvine.chronicles.ClassName`, until that's ported.
//
// `hotcHome` points at the HotChocolate compiler's own checkout -- override via
// `-PhotcHome=...` or `gradle.properties` on a machine where it lives somewhere else.
def hotcHome = project.findProperty('hotcHome') ?: 'C:/Users/conno/Desktop/PhoenixVineDigital/HotChocolate'
def hotcSrcDir = file('src/main/hotc')
def hotcOutDir = layout.buildDirectory.dir('classes/hotc/main')

configurations {
    hotcCompiler
}

dependencies {
    hotcCompiler 'org.ow2.asm:asm:9.7'
    hotcCompiler 'org.ow2.asm:asm-analysis:9.7'
    hotcCompiler 'org.ow2.asm:asm-tree:9.7'
    hotcCompiler 'org.ow2.asm:asm-util:9.7'
}

tasks.register('compileHotc', JavaExec) {
    group = 'hotc'
    description = 'Compiles src/main/hotc/*.hotc via the self-hosted HotChocolate compiler (SelfhostCLI).'
    onlyIf { hotcSrcDir.exists() }
    doFirst {
        hotcOutDir.get().asFile.mkdirs()
    }
    workingDir = hotcOutDir.get().asFile
    // `selfhost/bootstrap` -- the checked-in, pre-compiled bootstrap seed of the self-hosted
    // compiler itself (no Kotlin involved at all, see that directory's own README.md) --
    // `build/classes/java/main` is where its `CodegenShim` (a tiny ASM-bytes-writing helper the
    // compiler's own codegen needs) lives.
    classpath = configurations.hotcCompiler + files("${hotcHome}/selfhost/bootstrap", "${hotcHome}/build/classes/java/main")
    mainClass.set('SelfhostCLI')
    // Build-only mode (`SelfhostCLI <dir>`, no `run` prefix) -- compiles every `.hotc` file
    // under `hotcSrcDir` as ONE merged compilation unit (cross-file references between them
    // resolve, matching how a real multi-file Java package works), writing every struct's own
    // `.class` (plus a synthetic, never-directly-used "entry holder" class for top-level
    // fns/statics) into `workingDir` above.
    args = [hotcSrcDir.absolutePath]
}

sourceSets {
    main {
        // `output.dir(...)` alone only affects what DOWNSTREAM consumers of this sourceSet see
        // (e.g. a project depending on this one) -- `src/main/java`'s OWN `compileJava` reads
        // `compileClasspath` separately, so hotc's compiled classes need to be added there too
        // (and to `runtimeClasspath`, for the actual running game) for real Java code in THIS
        // module to reference them at all.
        output.dir(hotcOutDir, builtBy: 'compileHotc')
        compileClasspath += files(hotcOutDir).builtBy('compileHotc')
        runtimeClasspath += files(hotcOutDir).builtBy('compileHotc')
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
    maven {
        // EMI
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
    maven {
        url = "https://maven.architectury.dev"
    }
    maven {
        // KubeJS, Rhino
        name = "LatvianModder"
        url = "https://maven.latvian.dev/releases"
    }
    maven {
        // Applied Energistics 2
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }

    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    flatDir {
        dir 'libs'
    }

}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
        gameTestServer {
            // RunModel has no gameTestServer() convenience method (only client()/clientData()/
            // data()/server()/serverData()) - the run type still exists in Forge's userdev
            // template though, so it's set directly via the underlying `type` property.
            type = 'gameTestServer'
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}


apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    // JEI, EMI, Jade
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("curse.maven:jade-324717:5390389")
    modCompileOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modCompileOnly("curse.maven:phantasia-1589286:8604345")
    modRuntimeOnly("curse.maven:phantasia-1589286:8604345")

    modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}")
    modCompileOnly("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    modCompileOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")


    modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    modRuntimeOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")

    modCompileOnly("dev.latvian.mods:rhino-forge:${rhino_version}")
    modRuntimeOnly("dev.latvian.mods:rhino-forge:${rhino_version}")


    modCompileOnly("appeng:appliedenergistics2-forge:${appeng_version}")
    modRuntimeOnly("appeng:appliedenergistics2-forge:${appeng_version}")

    modCompileOnly("top.theillusivec4.curios:curios-forge:${curios_version}")
    modRuntimeOnly("top.theillusivec4.curios:curios-forge:${curios_version}")

    modRuntimeOnly("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    modRuntimeOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")


    modCompileOnly('curse.maven:phoenix-guilds-1612085:8460956')
    modRuntimeOnly('curse.maven:phoenix-guilds-1612085:8460956')



    modCompileOnly("curse.maven:phoenixwiki-1647798:8735977")
    modRuntimeOnly("curse.maven:phoenixwiki-1647798:8735977")

    modCompileOnly("net.phoenix.core:PhoenixCore:${phoenixcore_version}:slim") { transitive = false }


    modCompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modCompileOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    modCompileOnly("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modRuntimeOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modRuntimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    modRuntimeOnly("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        // Pulls in the same Minecraft/Forge classpath main compiles against, so pure-logic
        // classes that merely reference simple data types (ResourceLocation, CompoundTag,
        // Component.literal, Style) can be unit tested without a running game or registry
        // bootstrap - anything that actually needs live registries/rendering stays untested.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}




tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {

    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true"
}

tasks.register('publishToDomains', Copy) {
    group = 'phoenix'
    description = 'Builds this mod and copies the jar into ../Phoenix-Domains/libs, so Domains picks up local changes.'
    dependsOn 'reobfJar'
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into '../Phoenix-Domains/libs'
}
